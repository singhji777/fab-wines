<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fab Wines | Owner Dashboard</title><link rel="icon" href="/logo.png"><meta name="robots" content="noindex"><link rel="stylesheet" href="/fonts.css">
<style>
:root{--ink:#1b1209;--soft:#6a5e55;--line:#e4dccb;--cream:#f7f3ec;--gold:#c9a24b;--wine:#4a1624;--ruby:#a8153a;--ok:#1f6a3b;--black:#050404}
*{box-sizing:border-box}body{margin:0;font-family:'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px}
h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;margin:0}
.top{background:var(--black);color:#f3e9d2;padding:14px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.top img{height:38px}.top b{font-family:'Bodoni Moda',Georgia,serif;font-size:24px;letter-spacing:.1em;color:var(--gold)}.top a,.top button{color:#f3e9d2;background:none;border:1px solid #4a3a22;padding:8px 14px;border-radius:8px;text-decoration:none;cursor:pointer;font:inherit;font-size:13px}.sp{flex:1}
nav{display:flex;gap:4px;padding:14px 22px 0;flex-wrap:wrap}nav button{border:0;background:none;padding:10px 16px;font:inherit;border-radius:10px 10px 0 0;cursor:pointer;color:var(--soft)}nav button.on{background:#fff;color:var(--wine);font-weight:600}
main{background:#fff;margin:0 22px 40px;padding:24px;border-radius:0 14px 14px 14px;min-height:60vh;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.k{background:var(--cream);border-radius:14px;padding:18px}.k small{color:var(--soft);letter-spacing:.14em;text-transform:uppercase;font-size:11.5px}.k b{display:block;font-family:'Bodoni Moda',serif;font-size:40px;line-height:1.1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:500}
.wrap{overflow-x:auto}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input.n{width:96px}input.s{width:70px}
.btn{background:var(--black);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;font-size:13px}.btn:hover{background:var(--gold);color:#000}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;background:#efe6cf;color:#6e5410;white-space:nowrap}.pill.Delivered{background:#e1f1e6;color:var(--ok)}.pill.Cancelled{background:#f9e0e4;color:#8b1230}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line);padding:0 4px;margin-bottom:6px}.bars i{flex:1;max-width:64px;background:linear-gradient(var(--gold),#8a6a22);border-radius:4px 4px 0 0;min-height:3px;position:relative}.bars i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap;font-style:normal}
.two{display:grid;grid-template-columns:2fr 1fr;gap:24px}@media(max-width:860px){.two{grid-template-columns:1fr}}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:30px;border-radius:16px;border:1px solid var(--gold)}.login img{width:120px;display:block;margin:0 auto 10px}.login h2{text-align:center;font-size:34px;margin-bottom:18px}.login input{width:100%;margin-bottom:12px;padding:12px}.err{color:#8b1230;margin-bottom:10px}
.low{color:var(--ruby);font-weight:600}.mut{color:var(--soft);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
</style></head><body>
<div id="app"></div>
<script>
var T=null,$=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},money=function(n){return '₹'+new Intl.NumberFormat('en-IN').format(n)};
try{T=localStorage.getItem('fabtoken')}catch(e){}
function api(p,o){o=o||{};return fetch(p,{method:o.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:o.body?JSON.stringify(o.body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Error');return j})})}
function loginView(msg){$('#app').innerHTML='<form class="login" id="lf"><img src="/logo.png" alt=""><h2>Owner login</h2>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'<input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn" style="width:100%;padding:13px">Login</button></form>';
  $('#lf').onsubmit=function(e){e.preventDefault();var f=new FormData(this);fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(j){if(j.user.role!=='admin')throw new Error('This account is not the owner account.');T=j.token;try{localStorage.setItem('fabtoken',T)}catch(e){}shell()}).catch(function(er){loginView(er.message)})}}
var TABS=['Overview','Orders','Products','Customers','Messages'],tab='Overview';
function shell(){api('/api/me').then(function(j){if(j.user.role!=='admin')throw 0;
  $('#app').innerHTML='<div class="top"><img src="/logo.png" alt=""><b>OWNER DASHBOARD</b><span class="sp"></span><a href="/">View shop</a><button id="lo">Log out</button></div><nav id="nav"></nav><main id="main"></main>';
  $('#lo').onclick=function(){try{localStorage.removeItem('fabtoken')}catch(e){}T=null;loginView()};
  $('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t+'" class="'+(t===tab?'on':'')+'">'+t+'</button>'}).join('');
  $('#nav').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;shell()}};
  VIEW[tab]()}).catch(function(){loginView()})}
var VIEW={
Overview:function(){api('/api/admin/stats').then(function(s){var mx=Math.max.apply(null,s.days.map(function(d){return d.s}).concat(1));
 $('#main').innerHTML='<div class="grid"><div class="k"><small>Revenue</small><b>'+money(s.revenue)+'</b></div><div class="k"><small>Orders</small><b>'+s.orders+'</b></div><div class="k"><small>Today</small><b>'+money(s.todayRevenue)+'</b><span class="mut">'+s.todayOrders+' orders</span></div><div class="k"><small>Customers</small><b>'+s.customers+'</b></div><div class="k"><small>Messages</small><b>'+s.enquiries+'</b></div></div>'
 +'<div class="two"><div><h3>Sales, last 14 days</h3>'+(s.days.length?'<div class="bars">'+s.days.map(function(d){return '<i style="height:'+Math.max(3,d.s/mx*100)+'%" data-t="'+d.d+': '+money(d.s)+'"></i>'}).join('')+'</div><div class="mut">Hover a bar for the day total.</div>':'<p class="mut">No orders yet. Place a test order from the shop to see it here.</p>')
 +'<h3 style="margin-top:24px">Orders by status</h3><p>'+(s.byStatus.map(function(b){return '<span class="pill '+b.status+'">'+b.status+': '+b.c+'</span> '}).join('')||'<span class="mut">None yet</span>')+'</p></div>'
 +'<div><h3>Best sellers</h3>'+(s.top.length?'<table>'+s.top.map(function(t){return '<tr><td>'+esc(t[0])+'</td><td>'+t[1]+' sold</td></tr>'}).join('')+'</table>':'<p class="mut">Nothing sold yet.</p>')+'<h3 style="margin-top:24px">Low stock</h3>'+(s.low.length?'<table>'+s.low.map(function(t){return '<tr><td>'+esc(t.name)+'</td><td class="low">'+t.stock+' left</td></tr>'}).join('')+'</table>':'<p class="mut">All stocked.</p>')+'</div></div>'})},
Orders:function(){api('/api/admin/orders').then(function(l){var ST=['Placed','Confirmed','Packed','Out for delivery','Delivered','Cancelled'];
 $('#main').innerHTML=l.length?'<div class="wrap"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+l.map(function(o){return '<tr><td><b>'+o.id+'</b><div class="mut">'+new Date(o.created).toLocaleString('en-IN')+'</div></td><td>'+esc(o.name)+'<div class="mut">'+esc(o.phone)+'</div><div class="mut">'+esc(o.address)+', '+esc(o.city)+' '+esc(o.pincode)+'</div></td><td>'+o.items.map(function(i){return i.q+' × '+esc(i.name)}).join('<br>')+'<div class="mut">'+esc(o.payment)+(o.coupon?' · '+esc(o.coupon):'')+'</div></td><td>'+money(o.total)+'</td><td><select data-id="'+o.id+'">'+ST.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</table></div>':'<p class="mut">No orders yet.</p>';
 $('#main').onchange=function(e){var s=e.target.closest('select[data-id]');if(s)api('/api/admin/orders/'+s.dataset.id,{method:'PUT',body:{status:s.value}}).then(function(){s.style.outline='2px solid #1f6a3b';setTimeout(function(){s.style.outline=''},900)}).catch(function(er){alert(er.message)})}})},
Products:function(){api('/api/admin/products').then(function(l){
 $('#main').innerHTML='<div class="row"><button class="btn" id="np">+ Add a wine</button><span class="mut">Edit a row and press Save. Hidden wines disappear from the shop.</span></div><div class="wrap"><table><tr><th>Wine</th><th>Price</th><th>MRP</th><th>Stock</th><th>Badge</th><th>Shown</th><th></th></tr>'+l.map(function(p){return '<tr data-id="'+p.id+'"><td><input name="name" value="'+esc(p.name)+'" style="min-width:200px"><div class="mut">'+esc(p.type)+' · '+esc(p.year)+'</div></td><td><input class="n" name="price" type="number" value="'+p.price+'"></td><td><input class="n" name="mrp" type="number" value="'+p.mrp+'"></td><td><input class="s" name="stock" type="number" value="'+p.stock+'"></td><td><input class="s" name="badge" value="'+esc(p.badge)+'"></td><td><input name="active" type="checkbox"'+(p.active?' checked':'')+'></td><td><button class="btn sv">Save</button></td></tr>'}).join('')+'</table></div>';
 $('#main').onclick=function(e){var b=e.target.closest('.sv');if(!b)return;var r=b.closest('tr'),g=function(n){return r.querySelector('[name='+n+']')};api('/api/admin/products/'+r.dataset.id,{method:'PUT',body:{name:g('name').value,price:g('price').value,mrp:g('mrp').value,stock:g('stock').value,badge:g('badge').value,active:g('active').checked}}).then(function(){b.textContent='Saved ✓';setTimeout(function(){b.textContent='Save'},1200)}).catch(function(er){alert(er.message)})};
 $('#np').onclick=function(){var name=prompt('Wine name?');if(!name)return;var price=prompt('Selling price in ₹?');var mrp=prompt('MRP in ₹? (leave blank to match price)')||price;var stock=prompt('Stock quantity?')||0;var type=prompt('Type: Red, White, Rosé or Port','Red');api('/api/admin/products',{method:'POST',body:{name:name,price:price,mrp:mrp,stock:stock,type:type}}).then(function(){VIEW.Products()}).catch(function(er){alert(er.message)})}})},
Customers:function(){api('/api/admin/customers').then(function(l){$('#main').innerHTML=l.length?'<div class="wrap"><table><tr><th>Name</th><th>Contact</th><th>Orders</th><th>Spent</th><th>Joined</th></tr>'+l.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'<div class="mut">'+esc(c.phone)+'</div></td><td>'+c.orders+'</td><td>'+money(c.spent)+'</td><td>'+new Date(c.created).toLocaleDateString('en-IN')+'</td></tr>'}).join('')+'</table></div>':'<p class="mut">No customers yet.</p>'})},
Messages:function(){api('/api/admin/enquiries').then(function(l){$('#main').innerHTML=l.length?l.map(function(m){return '<div style="border-bottom:1px solid var(--line);padding:14px 0"><b>'+esc(m.name)+'</b> · <a href="mailto:'+esc(m.email)+'">'+esc(m.email)+'</a> <span class="mut">'+new Date(m.created).toLocaleString('en-IN')+'</span><p style="margin:6px 0 0">'+esc(m.message)+'</p></div>'}).join(''):'<p class="mut">No messages yet.</p>'})}};
T?shell():loginView();
</script></body></html>
